[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diary"
version = "0.1.0"
description = "A markdown-backed dev diary: todos, daily logs, project history, and LLM Q&A."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
diary = "diary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
